---
- name: Install and configure HashiCorp Vault
  hosts: vault
  become: true

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - gnupg
          - unzip
          - wget
        state: present
        update_cache: yes

    - name: Add HashiCorp GPG key
      shell: |
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main"
        state: present
        filename: hashicorp

    - name: Install Vault
      apt:
        name: vault
        state: present
        update_cache: yes

    - name: Create Vault config directory
      file:
        path: /etc/vault.d
        state: directory
        owner: vault
        group: vault
        mode: '0755'

    - name: Create Vault data directory
      file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: '0755'

    - name: Write Vault config
      copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
        content: |
          ui = true

          storage "file" {
            path = "/opt/vault/data"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = true
          }

          api_addr = "http://192.168.0.251:8200"
          cluster_addr = "http://192.168.0.251:8201"

    - name: Enable and start Vault service
      systemd:
        name: vault
        enabled: yes
        state: started

    - name: Wait for Vault to start
      wait_for:
        port: 8200
        delay: 5
        timeout: 30
