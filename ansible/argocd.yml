---
- name: Install ArgoCD
  hosts: control
  become: false
  tasks:
    - name: Add ArgoCD Helm repo
      command: helm repo add argo https://argoproj.github.io/argo-helm

    - name: Update Helm repos
      command: helm repo update

    - name: Install ArgoCD
      command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd
        --create-namespace
        --set server.service.type=LoadBalancer
        --wait
        --timeout 10m
      become_user: ubuntu

    - name: Get ArgoCD IP
      command: kubectl get svc -n argocd argocd-server -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      become_user: ubuntu
      register: argocd_ip

    - name: Get ArgoCD initial password
      command: kubectl get secret -n argocd argocd-initial-admin-secret -o jsonpath='{.data.password}'
      become_user: ubuntu
      register: argocd_password_b64

    - name: Decode initial password
      set_fact:
        argocd_initial_password: "{{ argocd_password_b64.stdout | b64decode }}"

    - name: Install ArgoCD CLI
      become: true
      get_url:
        url: https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        dest: /usr/local/bin/argocd
        mode: '0755'

    - name: Wait for ArgoCD server to be ready
      command: kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=120s
      become_user: ubuntu

    - name: Login to ArgoCD
      command: >
        argocd login {{ argocd_ip.stdout }}
        --username admin
        --password {{ argocd_initial_password }}
        --insecure
      become_user: ubuntu

    - name: Update ArgoCD admin password
      command: >
        argocd account update-password
        --current-password {{ argocd_initial_password }}
        --new-password {{ vault_argocd_password }}
        --insecure
      become_user: ubuntu

    - name: Show ArgoCD details
      debug:
        msg:
          - "ArgoCD URL: https://{{ argocd_ip.stdout }}"
          - "Username: admin"
          - "Password: {{ vault_argocd_password }}"

    - name: Clone k8s-apps repo
      git:
        repo: https://github.com/lowones/k8s-apps.git
        dest: /tmp/k8s-apps
        version: main
        force: true

    - name: Apply ArgoCD app manifests
      command: kubectl apply -f /tmp/k8s-apps/argocd/
      become_user: ubuntu
