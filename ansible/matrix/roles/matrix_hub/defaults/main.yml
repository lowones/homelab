---
# Shared variables (matrix_src, matrix_base, matrix_user, matrix_nodes, ...) live in
# ../../group_vars/all.yml.

matrix_hub_dirs: "{{ ['bin', 'etc', 'log', 'deploy', 'stash', 'outbound', 'update', 'inbound'] + matrix_nodes }}"
# python3-packaging: the ansible pip module imports it on the target.
matrix_hub_packages: [rsync, imagemagick, python3-venv, python3-packaging, git, openssh-client]
matrix_hub_pip_packages: [requests, psutil]

# Subdirectories of matrix_src rsynced to {{ matrix_base }}/<dir>/ (no --delete).
matrix_hub_sync_dirs: [bin, deploy]
matrix_hub_sync_excludes: ["bak/", "nodes/", "__pycache__/", "*.pyc"]

# Source files, relative to matrix_src. lowlib is vendored from Tron.
matrix_hub_lowlib_src: "{{ matrix_src }}/vendor/lowlib.py"
matrix_hub_unit_src: "{{ matrix_src }}/deploy/tron/matrix-monitor.service"
matrix_hub_logrotate_src: "{{ matrix_src }}/deploy/tron/logrotate-matrix-monitor"

# Resource guard so a runaway monitor cannot starve AdGuard/DDNS on this box.
matrix_hub_cpu_quota: 150%
matrix_hub_memory_max: 768M

# Public keys allowed to log in as matrix_user: one per line, on the controller,
# OUTSIDE git. Skipped if the file does not exist.
matrix_hub_authorized_keys_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ansible-matrix/authorized_keys"

# The hub's own key (generated on the hub if missing) and the aliases it needs.
matrix_hub_ssh_key_name: id_ed25519_matrix
matrix_hub_ssh_hosts:
  - { alias: low-ones, hostname: service.low-ones.com, port: 7822 }
  - { alias: cabin, hostname: 192.168.0.232, port: 22 }
  - { alias: driveway, hostname: 192.168.0.233, port: 22 }
  - { alias: tron, hostname: 192.168.0.2, port: 22 }

# DRY_RUN=1 in matrix.conf: the monitor resizes and stashes but never rsyncs,
# sshes or pings healthchecks. Leave true until cutover.
matrix_hub_dry_run: true

# Shadow run: start the monitor in dry-run mode and feed it images pulled
# read-only from Tron, so it can be compared with the live hub before cutover.
# Needs the restricted key on Tron (see README) and matrix_hub_dry_run: true.
matrix_hub_shadow: false
matrix_hub_shadow_host: 192.168.0.2
matrix_hub_shadow_alias: tron
# Cameras write a new frame about every 7.5 s; 30 s is plenty for a shadow run and keeps load on the live hub low.
matrix_hub_shadow_interval: 30s
# Optional: expected Tron ed25519 host key fingerprint ("SHA256:..."). If set,
# the play fails when the scanned key does not match. Get it on Tron with:
#   ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
matrix_hub_shadow_hostkey_fingerprint: ""

# Log in to low-ones once as a check (needs the hub's key authorized there).
matrix_hub_check_lowones: true
