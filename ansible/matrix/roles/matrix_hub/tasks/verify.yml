---
# Read-only checks. Skipped in --check mode, where nothing has been installed.
- name: Import lowlib with the hub's Python
  ansible.builtin.command:
    cmd: "{{ matrix_base }}/.venv/bin/python -c 'import sys, lowlib; print(sys.version.split()[0], lowlib.__file__)'"
    chdir: "{{ matrix_base }}/bin"
  register: matrix_hub_lowlib
  changed_when: false
  when: not ansible_check_mode

- name: Byte-compile the monitor and its config module
  ansible.builtin.command:
    cmd: "{{ matrix_base }}/.venv/bin/python -m py_compile image_update_monitor.py matrix_config.py"
    chdir: "{{ matrix_base }}/bin"
  changed_when: false
  when: not ansible_check_mode

- name: Confirm convert works
  ansible.builtin.command: convert -version
  register: matrix_hub_convert_final
  changed_when: false
  when: not ansible_check_mode

# Same call the monitor makes (resize to 1920px wide, quality 85), on a real JPEG.
- name: Resize a test JPEG with convert
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -e
      t=$(mktemp -d)
      convert -size 2400x1600 xc:gray "$t/in.jpg"
      convert "$t/in.jpg" -resize 1920x -quality 85 "$t/out.jpg"
      convert "$t/out.jpg" -format '%w' info:
      rm -rf "$t"
  register: matrix_hub_resize
  changed_when: false
  when: not ansible_check_mode

- name: Assert the resize produced a 1920px-wide image
  ansible.builtin.assert:
    that: matrix_hub_resize.stdout | trim == '1920'
    quiet: true
  when: not ansible_check_mode

- name: Confirm rsync works
  ansible.builtin.command: rsync --version  # noqa: command-instead-of-module
  register: matrix_hub_rsync
  changed_when: false
  when: not ansible_check_mode

# While dry_run is on, nothing that could reach low-ones may be running, so two
# hubs never push at once. During the shadow run only the dry-run monitor and the
# image feed may run, and the tunnel must stay down. Once the hub is live
# (matrix_hub_dry_run false) the monitor and tunnel are expected to be running, so
# this only reports their state; stopping Tron first is a manual cutover step.
- name: Check which matrix services are running
  ansible.builtin.command: "systemctl is-active {{ item }}"  # noqa: command-instead-of-module
  loop: "{{ ['tunnel-lowones.service'] if matrix_hub_shadow | bool else ['matrix-monitor.service', 'tunnel-lowones.service'] }}"
  register: matrix_hub_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert nothing that could reach low-ones is running
  ansible.builtin.assert:
    that: matrix_hub_active.results | selectattr('stdout', 'equalto', 'active') | list | length == 0
    fail_msg: >-
      A matrix service is already active on {{ inventory_hostname }}. This must not
      run alongside Tron outside the dry-run shadow run. Stop it first
      (sudo systemctl disable --now matrix-monitor matrix-shadow-feed.timer).
    quiet: true
  when: matrix_hub_dry_run | bool

- name: Verify the shadow run
  when: matrix_hub_shadow | bool and not ansible_check_mode
  block:
    - name: Confirm dry-run mode is set in matrix.conf
      ansible.builtin.command: "grep -qx 'DRY_RUN=1' {{ matrix_base }}/etc/matrix.conf"  # noqa: command-instead-of-shell
      changed_when: false

    - name: Check the monitor and the feed timer are active
      ansible.builtin.command: "systemctl is-active {{ item }}"  # noqa: command-instead-of-module
      loop: [matrix-monitor.service, matrix-shadow-feed.timer]
      changed_when: false

    # The unit appends stdout/stderr to {{ matrix_base }}/log/monitor.log (not the journal).
    - name: Wait for the monitor to log that it started
      ansible.builtin.wait_for:
        path: "{{ matrix_base }}/log/monitor.log"
        search_regex: "nodes: "
        timeout: 30

    - name: Last lines of the monitor log
      ansible.builtin.command: "tail -n 12 {{ matrix_base }}/log/monitor.log"
      register: matrix_hub_shadow_log
      changed_when: false

- name: Report
  ansible.builtin.debug:
    msg:
      - "python / lowlib: {{ matrix_hub_lowlib.stdout | default('skipped in check mode') }}"
      - "convert: {{ (matrix_hub_convert_final.stdout_lines | default(['skipped in check mode']))[0] }}"
      - "rsync: {{ (matrix_hub_rsync.stdout_lines | default(['skipped in check mode']))[0] }}"
      - >-
        matrix services:
        {{ 'LIVE hub: ' ~ (matrix_hub_active.results | map(attribute='item')
        | zip(matrix_hub_active.results | map(attribute='stdout')) | map('join', '=') | join(', '))
        if not (matrix_hub_dry_run | bool)
        else ('shadow run: dry-run monitor + image feed from Tron active, tunnel stopped'
        if matrix_hub_shadow | bool else 'none (monitor and tunnel are installed but stopped)') }}
      - >-
        monitor log:
        {{ (matrix_hub_shadow_log.stdout_lines | default([]) | join(' | '))
        if matrix_hub_shadow | bool and not ansible_check_mode else 'n/a' }}
