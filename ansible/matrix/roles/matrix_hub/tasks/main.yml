---
- name: Check sources on the controller
  ansible.builtin.import_tasks: preflight.yml
- name: Base system (group, packages, directories)
  ansible.builtin.import_tasks: base.yml
- name: Application files and Python environment
  ansible.builtin.import_tasks: app.yml
- name: Systemd units and logrotate (installed, not started)
  ansible.builtin.import_tasks: service.yml
- name: SSH keys and aliases
  ansible.builtin.import_tasks: ssh.yml
- name: Low-ones trust and the tunnel unit (installed, not enabled)
  ansible.builtin.import_tasks: lowones.yml
- name: Shadow run (dry-run monitor fed from Tron), only when matrix_hub_shadow is true
  ansible.builtin.import_tasks: shadow.yml
- name: Verify
  ansible.builtin.import_tasks: verify.yml
