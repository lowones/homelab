---
# Variables shared by every matrix role (hub now; Pis and low-ones later).

# Checkout of the (private) matrix_matrix app repo on the CONTROLLER. Files are
# pushed from here, so targets never need GitHub access.
matrix_src: "{{ lookup('ansible.builtin.env', 'HOME') }}/dev/matrix_matrix"

matrix_base: /matrix
matrix_user: lowone
matrix_group: matrix
matrix_nodes: [cabin, driveway]

# Written to {{ matrix_base }}/etc/matrix.conf
matrix_remote_server: low-ones
matrix_stale_duration: 5
matrix_hc_base: https://hc-ping.com

# The low-ones VPS, as the hub reaches it. The fingerprint is the ED25519 host key
# (public information); the play fails if the scanned key does not match it.
matrix_lowones_host: service.low-ones.com
matrix_lowones_port: 7822
matrix_lowones_hostkey_fingerprint: "SHA256:paXSB5ITzgYaU1YZI3SGojr97XV8a43Fl+CNmCmKbpA"

# Where the Pis and the low-ones container reach the hub.
matrix_hub_address: 192.168.0.240
