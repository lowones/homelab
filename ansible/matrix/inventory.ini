# Matrix camera pipeline. Run from batcomputer.
# Hub = Oracle (the replacement for Tron). Pis = the camera nodes. The low-ones VPS joins
# this inventory in a later phase.
[matrix_hub]
oracle  ansible_host=192.168.0.240

[matrix_hub:vars]
ansible_user=lowone

[matrix_pis]
cabin     ansible_host=192.168.0.232
driveway  ansible_host=192.168.0.233

[matrix_pis:vars]
ansible_user=lowone
