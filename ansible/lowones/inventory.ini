# low-ones VPS (AlmaLinux 9, OpenVZ). sudo needs a password: run with -K.
[vps]
low-ones ansible_host=service.low-ones.com ansible_port=7822 ansible_user=lowone

# RV Mac mini (hostname neverland, standalone, NOT part of matrix). Replaced the Pi (zero) on 2026-10-15.
# Reached THROUGH its own reverse tunnel: batcomputer -> low-ones -> localhost:8677.
# Before the tunnel exists, bootstrap by hand with bootstrap-mac.sh (see README.md).
[rv]
mini ansible_host=localhost ansible_port=8677 ansible_user=lowone ansible_ssh_common_args='-o ProxyJump=lowone@service.low-ones.com:7822 -o HostKeyAlias=mini'

[all:vars]
ansible_python_interpreter=/usr/bin/python3
