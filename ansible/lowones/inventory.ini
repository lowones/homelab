# low-ones VPS (AlmaLinux 9, OpenVZ). sudo needs a password: run with -K.
[vps]
low-ones ansible_host=service.low-ones.com ansible_port=7822 ansible_user=lowone

# RV Pi (Zero 2 W, standalone, NOT part of matrix).
# Reached THROUGH its own reverse tunnel: batcomputer -> low-ones -> localhost:8677.
# Before the tunnel exists, bootstrap by hand over Tailscale (see README.md).
[rv]
zero ansible_host=localhost ansible_port=8677 ansible_user=lowone ansible_ssh_common_args='-o ProxyJump=lowone@service.low-ones.com:7822 -o HostKeyAlias=zero'

[all:vars]
ansible_python_interpreter=/usr/bin/python3
