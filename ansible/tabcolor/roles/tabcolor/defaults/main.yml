---
# Fallback if a host has no host_vars entry — deliberately drab so an
# unconfigured host is visually obvious rather than silently plausible.
tab_color:
  r: 60
  g: 60
  b: 60

# Root gets a distinct shade on every host. Same hue family would defeat the
# purpose; hot red reads as "you are root" at a glance.
tab_color_root:
  r: 230
  g: 30
  b: 30

# Title marker shown in terminals that cannot paint a tab (Ghostty, Termius...).
# A coloured square roughly matching tab_color; set it next to tab_color in each
# host's host_vars. Unconfigured hosts get the drab black square on purpose.
tab_emoji: "⬛"
tab_emoji_root: "🔴"

# Prompt: user@host takes the host colour (from tab_color); the path uses this SGR code.
# 01;34 is the usual blue. Set it per host when the host colour is also blue.
tab_path_sgr: "01;34"
