---
# One entry per camera. `name` is the stream name the TV page asks for (must match CAMS in rv-tv/tvserver.py);
# a `<name>_sub` stream (640x360, used by the grid) is made for each automatically.
# Per-camera `user` / `password` override the defaults below (use this once a camera's password is changed).
go2rtc_cameras:
  - { name: driveway, ip: 192.168.0.70 }
  - { name: coop, ip: 192.168.0.152 }
  - { name: barn, ip: 192.168.0.67 }
  - { name: leanto, ip: 192.168.0.64 }
  - { name: rv, ip: 192.168.0.58 }
  - { name: batcave, ip: 192.168.0.21 }

# Factory Onvif login of the Canny Cams. Replace with a per-camera password from Vault when they are changed, e.g.
#   - { name: driveway, ip: 192.168.0.70, password: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=homelab/data/cams/driveway:password') }}" }
go2rtc_cam_user: admin
go2rtc_cam_password: admin
