[control]
k8s-control ansible_host=192.168.0.210

[workers]
k8s-worker-1 ansible_host=192.168.0.211
k8s-worker-2 ansible_host=192.168.0.212
k8s-worker-3 ansible_host=192.168.0.213

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_extra_args="-o StrictHostKeyChecking=no"
