<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canny cameras</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:20px system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;gap:4px;background:#000}
.tile{position:relative;background:#0b0b0d;min-width:0;min-height:0;overflow:hidden}
.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.tile .name{position:absolute;left:12px;bottom:10px;padding:3px 10px;border-radius:8px;
  background:rgba(0,0,0,.55);color:#fff;font-size:18px;font-weight:600;z-index:2;pointer-events:none}
.tile.off{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#777}
.tile.off b{font-size:26px;color:#999;margin-bottom:6px}
#warn{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;padding:10px 18px;border-radius:10px;
  background:#7a1f1f;color:#fff;font-size:18px;display:none}
</style></head><body>
<div id="wrap"></div>
<div id="warn">Cameras not reachable: is the tunnel to oracle up? Retrying...</div>
<script>
var CFG = __CFG__;
var wrap = document.getElementById('wrap'), warn = document.getElementById('warn');
var live = CFG.cams.filter(function (c) { return c.live; });
var show = CFG.src === 'all' ? CFG.cams : CFG.cams.filter(function (c) { return c.id === CFG.src; });
var grid = CFG.src === 'all';
// Grid tiles use the small stream (<name>_sub); a single camera uses the full-size one.
function frameUrl(c) {
  var name = grid ? c.id + '_sub' : c.id;
  return CFG.g2r + '/stream.html?src=' + encodeURIComponent(name) + '&mode=mse';
}
var frames = [];
function build() {
  wrap.innerHTML = '';
  frames = [];
  var cols = grid ? 2 : 1, rows = Math.ceil(show.length / cols);
  wrap.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
  wrap.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
  show.forEach(function (c) {
    var t = document.createElement('div');
    t.className = 'tile';
    if (c.live) {
      var f = document.createElement('iframe');
      f.setAttribute('allow', 'autoplay; fullscreen');
      f.dataset.src = frameUrl(c);
      t.appendChild(f);
      frames.push(f);
      var n = document.createElement('div');
      n.className = 'name'; n.textContent = c.label;
      t.appendChild(n);
    } else {
      t.className += ' off';
      t.innerHTML = '<b></b><span>not connected</span>';
      t.firstChild.textContent = c.label;
    }
    wrap.appendChild(t);
  });
}
function load() { frames.forEach(function (f) { f.src = f.dataset.src; }); }
// go2rtc is reached through an ssh tunnel to oracle. A no-cors fetch can't read the answer but
// does fail on a refused connection, which is all we need to tell "tunnel down" from "up".
var up = null;
async function check() {
  var ok = true;
  try { await fetch(CFG.g2r + '/api/streams', {mode: 'no-cors', cache: 'no-store'}); } catch (e) { ok = false; }
  warn.style.display = ok ? 'none' : 'block';
  if (ok && up !== true) load();      // first success, or the tunnel came back: (re)start the video
  up = ok;
}
build();
check();
setInterval(check, 10000);
</script></body></html>
